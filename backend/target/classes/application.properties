# ===================================
# KrushiMitra AI - Application Config
# ===================================

# Server
server.port=8082
server.servlet.context-path=/api

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/krushimitra_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Kalyani@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=krushimitra-super-secret-key-2024-production-ready-secure-key-256bit
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# Logging
logging.level.com.krushimitra=DEBUG
logging.level.org.springframework.security=INFO

# CORS
app.cors.allowed-origins=http://localhost:3000

# App Info
app.name=KrushiMitra AI
app.version=1.0.0
